# v4 反向丢包的廉价缓解：把每个 CPU 的 netif_rx backlog 从默认 1000 抬到 4096。
#
# 缓解的是 netif_rx backlog 溢出（`netdev_max_backlog` 打满时内核走
# "dropping packet" 分支）。根因不在这个旋钮：v4 反向的帧没有进 PPE，
# 走的是 stack 路径，而且每帧在 ring/驱动里存在 2 份副本，所以单位时间
# 入 backlog 的 skb 数是正向的 2 倍。见
# .scratch/ffe-fastpath/v4-truth/20261104-0500（证据与本轮的取舍理由）。
#
# 落点选择：本树在 /etc/sysctl.d/ 上已有机制——package/base-files 的
# /etc/init.d/sysctl（S11，见 files/etc/init.d/sysctl 的 start()）
# 在开机时对 /etc/sysctl.d/*.conf 逐个 `sysctl -e -p`，且
# /etc/sysctl.d/11-nf-conntrack.conf 就是同一机制里已有的先例。
# 文件名排 10-default.conf / 11-nf-conntrack.conf 之后，写入的是同一个
# 全局键、互不覆盖。写成独立文件而不是塞进 e2631-netune：这是内核
# 网络栈的全局参数，和那份脚本调的 per-ring/irq 亲和不是一类东西。
net.core.netdev_max_backlog = 4096
